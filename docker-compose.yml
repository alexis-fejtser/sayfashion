services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sayfashion
      POSTGRES_USER: sayfashion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sayfashion -d sayfashion"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  shop:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: sayfashion
      PGUSER: sayfashion
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_POOL_SIZE: 10
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      shop:
        condition: service_healthy
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
